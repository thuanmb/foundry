spring.application.name=foundry-api

# Server
server.port=8080

# Database settings
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/foundry}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:foundry_app}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:foundry_local_pass}

# debugging (disabled in the prod profile)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.show_sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.type=trace
# debug=true

# Flyway settings
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.cleanDisabled=false

# Actuator health probes (Kubernetes liveness/readiness)
management.endpoint.health.probes.enabled=true
management.endpoints.web.exposure.include=health,prometheus
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true

# ============================================================
# Business Configuration Defaults
# All values overridable via Helm -> ConfigMap / env vars
# ============================================================

# --- Auth Configuration ---
auth.access-token.secret-key=${AUTH_JWT_SECRET_KEY}
auth.access-token.ttl-minutes=60
auth.access-token.issuer=foundry
auth.refresh-token.ttl-days=30
auth.refresh-token.max-per-user=5
auth.otp.length=6
auth.otp.expiry-minutes=5
auth.otp.max-attempts=5
auth.otp.rate-limit-per-hour=3
auth.otp.cooldown-sec=60
auth.jwe.ttl-hours=24
auth.jwe.algorithm=A256GCM
auth.jwe.secret-key=${AUTH_JWE_SECRET_KEY}

# --- Turnstile Configuration ---
turnstile.secret-key=${TURNSTILE_SECRET_KEY}
turnstile.verify-url=https://challenges.cloudflare.com/turnstile/v0/siteverify
turnstile.timeout-sec=5

# --- Device Attestation Configuration ---
attestation.ios-app-id=${IOS_APP_ID:com.thuanbui.foundry}
attestation.ios-environment=${IOS_ATTEST_ENVIRONMENT:development}
attestation.android-package-name=${ANDROID_PACKAGE_NAME:com.thuanbui.foundry}
attestation.android-decryption-key=${PLAY_INTEGRITY_DECRYPTION_KEY:}
attestation.android-verification-key=${PLAY_INTEGRITY_VERIFICATION_KEY:}
attestation.bypass-enabled=${ATTESTATION_BYPASS_ENABLED:false}

# --- SMS Provider Configuration ---
# twilio = send real SMS; anything else = NoOpSmsService (logs the OTP, dev only)
sms.provider=${SMS_PROVIDER:noop}
sms.twilio.account-sid=${TWILIO_ACCOUNT_SID:}
sms.twilio.auth-token=${TWILIO_AUTH_TOKEN:}
sms.twilio.from-number=${TWILIO_FROM_NUMBER:+1234567890}

# --- Firebase Configuration ---
firebase.web-api-key=${FIREBASE_WEB_API_KEY:}

# --- Worker / async job Configuration ---
worker.job.max-retries=3
worker.job.heartbeat-interval-sec=30
worker.job.stale-timeout-minutes=5
worker.job.stale-check-interval-sec=60
worker.job.graceful-shutdown-threshold-sec=10
worker.listen.channel=new_job
worker.listen.complete-channel=job_completed
worker.listen.fallback-poll-sec=30

# --- Cache Configuration ---
cache.caffeine.features-ttl-sec=30
cache.caffeine.mobile-config-ttl-sec=30
cache.caffeine.max-entries=1000

# --- Security Configuration ---
security.rate-limit.public-endpoints-per-sec=10
security.rate-limit.auth-endpoints-per-min=20
security.request.max-body-size-mb=10
security.cors.allowed-origins=*
security.cors.max-age-sec=3600

# --- SSE Configuration ---
sse.heartbeat-interval-sec=15
sse.connection-timeout-sec=300

# --- Polling Configuration ---
polling.initial-delay-sec=2
polling.max-delay-sec=15
polling.backoff-multiplier=2.0

# --- Feature Flags (feature.flags.<key>.enabled) ---
feature.flags.notes.enabled=true
feature.flags.echo.enabled=true
feature.flags.anonymousWeb.enabled=true

# --- Account Configuration ---
account.deletion.grace-period-days=30
account.deletion.anonymize-on-delete=true
account.deletion.cleanup-cron=0 0 3 * * ?
account.retention.inactive-days=365

# --- App Configuration ---
app.mobile.min-version=1.0.0
app.mobile.latest-version=1.0.0
