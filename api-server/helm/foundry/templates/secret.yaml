apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secrets
  labels:
    {{- include "foundry.labels" . | nindent 4 }}
type: Opaque
stringData:
  jwe-secret-key: {{ .Values.auth.jweSecretKey | quote }}
  jwt-secret-key: {{ .Values.auth.jwtSecretKey | quote }}
  turnstile-secret-key: {{ .Values.turnstile.secretKey | quote }}
  firebase-web-api-key: {{ .Values.firebase.webApiKey | quote }}
  twilio-account-sid: {{ .Values.twilio.accountSid | quote }}
  twilio-auth-token: {{ .Values.twilio.authToken | quote }}
  twilio-from-number: {{ .Values.twilio.fromNumber | quote }}
  play-integrity-decryption-key: {{ .Values.attestation.androidDecryptionKey | quote }}
  play-integrity-verification-key: {{ .Values.attestation.androidVerificationKey | quote }}
