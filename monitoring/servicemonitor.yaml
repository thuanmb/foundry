# ServiceMonitors for Prometheus Operator (kube-prometheus-stack).
# The `release: prometheus` label must match the operator's serviceMonitorSelector.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: foundry-api
  labels:
    release: prometheus
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: foundry
  endpoints:
    - port: http
      path: /actuator/prometheus
      interval: 30s
      scrapeTimeout: 10s
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: foundry-worker
  labels:
    release: prometheus
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: foundry-worker
  endpoints:
    - port: http
      path: /actuator/prometheus
      interval: 30s
      scrapeTimeout: 10s
