apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: foundry-alerts
  labels:
    release: prometheus
spec:
  groups:
    - name: foundry
      rules:
        - alert: HighJobQueueDepth
          expr: worker_jobs_queue_depth > 50
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Job queue depth {{ $value }} exceeds threshold"

        - alert: JobHighFailureRate
          expr: rate(worker_jobs_processed_total{status="failed"}[5m]) / rate(worker_jobs_processed_total[5m]) > 0.1
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Job failure rate {{ $value | humanizePercentage }} exceeds 10%"

        - alert: HighOTPFailureRate
          expr: rate(otp_sends_total{status="failed"}[5m]) > 20
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: "OTP failure spike: {{ $value }}/min"

        - alert: APIHighLatency
          expr: histogram_quantile(0.95, rate(http_server_requests_seconds_bucket[5m])) > 5
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "API p95 latency {{ $value }}s exceeds 5s"

        - alert: PodRestarting
          expr: increase(kube_pod_container_status_restarts_total[1h]) > 3
          labels:
            severity: critical
          annotations:
            summary: "Pod {{ $labels.pod }} restarting frequently"

