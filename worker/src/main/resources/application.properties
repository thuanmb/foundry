spring.application.name=foundry-worker

# Server — worker runs on a different port
server.port=${WORKER_PORT:8081}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# Logging
logging.file.path=${LOGGING_FILE_PATH:/var/log/app}
logging.file.name=${LOGGING_FILE_NAME:worker}
debug=true

# Database (same as API server)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/foundry}
spring.datasource.username=${DB_USERNAME:foundry_app}
spring.datasource.password=${DB_PASSWORD:foundry_local_pass}

# JPA — no Flyway, schema managed by API server
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Config files (prompt templates), keyed by file name. Filesystem paths (Helm ConfigMap mount) or classpath: locations.
# A missing filesystem file falls back to classpath:prompts/<file name>.
config.files.paths=${CONFIG_FILES_PATHS:/etc/opt/foundry/config/echo_prompt.system.txt,/etc/opt/foundry/config/echo_prompt.user.txt}

# Job processing
worker.job.max-retries=3
worker.job.heartbeat-interval-sec=30
worker.job.stale-timeout-minutes=5
worker.job.stale-check-interval-sec=60
worker.job.graceful-shutdown-threshold-sec=10

# LISTEN/NOTIFY channels — must match the API server
worker.listen.channel=new_job
worker.listen.complete-channel=job_completed
worker.listen.fallback-poll-sec=30

# LLM defaults
worker.llm.model=${LLM_MODEL:gpt-4.1-mini}
worker.llm.timeout-sec=120
worker.llm.max-tokens=1000
worker.llm.temperature=0.7

# ECHO demo job
worker.echo.llm-enabled=${ECHO_LLM_ENABLED:false}
worker.echo.max-delay-sec=30

# OpenAI
openai.api-key=${OPENAI_API_KEY:}
openai.base-url=https://api.openai.com/v1

# Actuator
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=when-authorized
