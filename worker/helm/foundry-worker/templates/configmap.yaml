apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "foundry-worker.fullname" . }}-config
  labels:
    {{- include "foundry-worker.labels" . | nindent 4 }}
data:
{{- /* Copied verbatim (no tpl): prompts use {{var}} placeholders resolved by the worker */}}
{{- range $path, $file := .Files.Glob "config/*" }}
  {{ base $path }}: |
{{ $.Files.Get $path | indent 4 }}
{{- end }}
