apiVersion: v1
kind: Secret
metadata:
  name: {{ include "foundry-worker.fullname" . }}-secret
  labels:
    {{- include "foundry-worker.labels" . | nindent 4 }}
type: Opaque
data:
  db-password: {{ .Values.postgresql.auth.password | b64enc | quote }}
  openai-api-key: {{ .Values.openai.apiKey | b64enc | quote }}
